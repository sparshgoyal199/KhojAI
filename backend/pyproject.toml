[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SparshGoyalFlexilyticsAI", email = "sparsh.goyal@flexilytics.ai" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
       "fastapi",
       "uvicorn",
       "python-dotenv",
       "python-multipart",
       "python-jose",
       "passlib",
       "bcrypt",
       "pydantic",
       "pydantic-settings",
       "supabase",
       "qdrant-client",
       "docling",
       "langchain",
       "langchain-groq",
       "langchain-docling",
       "langgraph",
       "langgraph-checkpoint-postgres",
       "groq",
       "openai",
       "modal",
       "torch",
       "transformers",
       "deepeval>=4",
       "numpy",
       "langchain-core>=1.5.4",
       "docling-core>=2.91.0",
       "psycopg[binary]>=3.3.4",
       "psycopg-pool>=3.3.1",
       "sqlalchemy>=2.0.52",
       "scikit-learn>=1.9.1",
       "mistralai>=3.6.0",
       "langchain-mistralai>=1.1.6",
       "langsmith>=0.11.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
